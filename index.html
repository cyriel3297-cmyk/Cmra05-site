<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cmra Shop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        /* MENU */
        nav {
            background: #222;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        /* ACCUEIL */
        .accueil {
            background: #007bff;
            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        .accueil h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .accueil p {
            font-size: 20px;
        }

        /* PRODUITS */
        .produits {
            padding: 50px 20px;
            text-align: center;
        }

        .produits h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .liste-produits {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .produit {
            background: white;
            width: 260px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .image-produit {
            font-size: 70px;
            margin-bottom: 15px;
        }

        .produit h3 {
            margin-bottom: 10px;
        }

        .prix {
            color: #007bff;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .bouton {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        .bouton:hover {
            background: #0056b3;
        }

        /* PANIER */
        .panier {
            background: white;
            margin: 30px auto;
            padding: 30px;
            max-width: 600px;
            border-radius: 12px;
            text-align: center;
        }

        .panier h2 {
            margin-bottom: 20px;
        }

        #liste-panier {
            margin: 20px 0;
        }

        .total {
            font-size: 24px;
            font-weight: bold;
            margin: 20px;
        }

        /* PIED DE PAGE */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }

        /* TELEPHONE */
        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .accueil h1 {
                font-size: 35px;
            }

            .produit {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- MENU -->
    <nav>

        <h2>🛍️ Cmra Shop</h2>

        <div>
            <a href="#accueil">Accueil</a>
            <a href="#produits">Produits</a>
            <a href="#panier">Panier 🛒</a>
        </div>

    </nav>


    <!-- ACCUEIL -->
    <section class="accueil" id="accueil">

        <h1>Bienvenue chez Cmra Shop 🛍️</h1>

        <p>
            Découvrez nos produits et ajoutez vos préférés au panier !
        </p>

    </section>


    <!-- PRODUITS -->
    <section class="produits" id="produits">

        <h2>Nos produits</h2>

        <div class="liste-produits">


            <!-- PRODUIT 1 -->
            <div class="produit">

                <div class="image-produit">
                    👕
                </div>

                <h3>T-shirt</h3>

                <p class="prix">
                    10 000 FCFA
                </p>

                <button class="bouton"
                    onclick="ajouterAuPanier('T-shirt', 10000)">
                    Ajouter au panier
                </button>

            </div>


            <!-- PRODUIT 2 -->
            <div class="produit">

                <div class="image-produit">
                    🧢
                </div>

                <h3>Casquette</h3>

                <p class="prix">
                    5 000 FCFA
                </p>

                <button class="bouton"
                    onclick="ajouterAuPanier('Casquette', 5000)">
                    Ajouter au panier
                </button>

            </div>


            <!-- PRODUIT 3 -->
            <div class="produit">

                <div class="image-produit">
                    🎒
                </div>

                <h3>Sac</h3>

                <p class="prix">
                    15 000 FCFA
                </p>

                <button class="bouton"
                    onclick="ajouterAuPanier('Sac', 15000)">
                    Ajouter au panier
                </button>

            </div>

        </div>

    </section>


    <!-- PANIER -->
    <section class="panier" id="panier">

        <h2>🛒 Mon panier</h2>

        <div id="liste-panier">
            Ton panier est vide.
        </div>

        <div class="total">
            Total : <span id="total">0</span> FCFA
        </div>

        <button class="bouton" onclick="viderPanier()">
            Vider le panier
        </button>

    </section>


    <!-- PIED DE PAGE -->
    <footer>

        <p>
            Cmra Shop © 2026
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script>

        let panier = [];

        let total = 0;


        function ajouterAuPanier(nom, prix) {

            panier.push({
                nom: nom,
                prix: prix
            });

            total = total + prix;

            afficherPanier();

        }


        function afficherPanier() {

            let liste = document.getElementById("liste-panier");

            liste.innerHTML = "";

            if (panier.length === 0) {

                liste.innerText = "Ton panier est vide.";

            } else {

                panier.forEach(function(produit) {

                    let element = document.createElement("p");

                    element.innerText =
                        produit.nom + " - " +
                        produit.prix + " FCFA";

                    liste.appendChild(element);

                });

            }

            document.getElementById("total").innerText = total;

        }


        function viderPanier() {

            panier = [];

            total = 0;

            afficherPanier();

        }

    </script>

</body>
</html>
